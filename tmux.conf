set -g status off
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set-window-option -g mode-keys vi

# Copy mode vi bindings (v for start selection, y for copy to clipboard)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -sel clip -i"

# Pane navigation (fixed the typo: c-Up -> C-Up)
# bind-key -n C-Left select-pane -L
# bind-key -n C-Down select-pane -D
# bind-key -n C-Up select-pane -U
# bind-key -n C-Right select-pane -R
# Bind ONLY with prefix: Ctrl+b + Arrow
bind-key -T prefix Left  select-pane -L
bind-key -T prefix Down  select-pane -D
bind-key -T prefix Up    select-pane -U
bind-key -T prefix Right select-pane -R

# Bonus: Easier entry to copy mode (e.g., prefix + Space starts copy mode with selection)
bind-key Space copy-mode \; send-keys -X begin-selection

# Skip confirmation when killing panes
bind-key -T prefix x kill-pane
# Stay in the window after closing a pane (don't detach)
set -g detach-on-destroy off

unbind t
bind-key "b" run-shell "sesh connect \"$(
  sesh list -t --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt 'Window  ' \
    --header ' ^a all ^t tmux ^g configs ^x zoxide ^d kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(Lightning  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(Window  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(Settings  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(Folder  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(Magnifying Glass  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(Window  )+reload(sesh list -t --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

bind-key "a" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# Next session
bind-key "n" run-shell "sesh connect \"$(sesh list -t | tail -n +2 | grep -v \"$(tmux display-message -p '#S')\" | head -n 1 || sesh list -t | tail -n +2 | head -n 1)\""
# Previous session (cycles backward)
bind-key "p" run-shell "sesh connect \"$(sesh list -t | tail -n +2 | grep -v \"$(tmux display-message -p '#S')\" | tail -n 1 || sesh list -t | tail -n +2 | tail -n 1)\""
